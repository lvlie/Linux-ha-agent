# Agent configuration used by the end-to-end workflow.
mqtt:
  url: tcp://127.0.0.1:1883
  username: e2e_host
  password_file: /etc/linux-ha-agent/mqtt-password
host:
  name: e2e-host
guests:
  snapshot_expiry: 1h
  restart_timeout: 20s
checks:
  interval: 1h
upgrade:
  restart_guests: true
  command_timeout: 30m
permissions:
  upgrade: true
  reboot_host: false
  reboot_guests: true
  reboot_exclude: [alpine]
  restore: true
  restart_containers: true
commands:
  allow_any: true
  allow_any_machines: [host, guests]
  expose:
    - name: Whoami
      command: id -un
      interval: 30s
      machines: [host, guests]
log_level: debug
