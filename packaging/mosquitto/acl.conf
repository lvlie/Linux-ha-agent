# Mosquitto ACL for incus-ha-agent. Reference it with `acl_file` and disable
# anonymous access (`allow_anonymous false`). Topics not listed are denied.

# Home Assistant's own user may read everything and send commands.
user homeassistant
topic readwrite #

# Every agent logs in with its host ID as username (%u) and can only touch
# its own topics: it cannot read or command other hosts, and cannot spoof
# their devices in Home Assistant.
pattern write homeassistant/device/%u/#
pattern readwrite incus-ha-agent/%u/#
pattern read homeassistant/status
