# linux-ha-agent configuration. Only mqtt.url is required; everything else
# shows its default. Copy to /etc/linux-ha-agent/config.yaml.

mqtt:
  # tcp://host:1883, or ssl://host:8883 for TLS (recommended).
  url: ssl://mqtt.lan:8883
  # Use the host ID as username so the broker ACL can restrict this agent to
  # its own topics (see packaging/mosquitto/acl.conf). The host ID is the
  # lowercase host name with anything but a-z, 0-9 and _ replaced by "_".
  username: myhost
  # File containing only the password (chmod 600). Never put it here.
  password_file: /etc/linux-ha-agent/mqtt-password
  # ca_file: /etc/linux-ha-agent/ca.pem         # private CA of the broker
  # client_cert_file: /etc/linux-ha-agent/client.pem  # mutual TLS
  # client_key_file: /etc/linux-ha-agent/client.key
  # insecure_skip_verify: false
  # client_id: linux-ha-agent-myhost

homeassistant:
  discovery_prefix: homeassistant
  base_topic: linux-ha-agent

host:
  # Device name in Home Assistant; defaults to the host name.
  # name: myhost
  # Check and upgrade this machine itself, not only its guests.
  manage: true

# Settings for the guests of all virtualisation platforms below.
guests:
  types: [container, virtual-machine]
  # Guests to ignore: "name", "project/name" (Incus) or the VMID (Proxmox),
  # shell-style wildcards allowed.
  exclude: []
  # Snapshot every guest before upgrading it; removed again after the expiry.
  # On Proxmox VE this needs storage with snapshot support (ZFS, LVM-thin, Ceph...).
  snapshot_before_upgrade: true
  snapshot_expiry: 168h
  restart_timeout: 2m

incus:
  # auto: use Incus when its socket exists. true / false to force.
  enabled: auto
  # socket: /var/lib/incus/unix.socket
  # Only these projects (empty: all projects).
  projects: []
  # Where incus-compose projects live: these directories and their direct
  # subdirectories are searched for compose files. Containers of a project
  # that is not found are reported, but not updated.
  compose_dirs: [/root]

proxmox:
  # auto: use Proxmox VE when /etc/pve and pvesh exist. true / false to force.
  enabled: auto
  # Node name; defaults to the short host name.
  # node: pve1
  # How often to look for guests that were created, removed, started or stopped.
  poll_interval: 1m

checks:
  # How often to look for updates (also on startup and when guests start).
  interval: 6h
  # Compare container images with their registries (HEAD requests only).
  container_images: true
  # How often CPU, memory, disk, load, uptime and kernel are refreshed
  # (0: only with the update checks).
  stats_interval: 5m
  # Entities for every docker/podman container (running, image update, restart).
  container_entities: true

upgrade:
  # Cron schedule for upgrading the host and all guests, e.g. Sundays 03:30.
  # Prefix with CRON_TZ=Europe/Amsterdam for another time zone. Empty: off.
  schedule: ""
  # Initial state of the "Automatic upgrades" switch in Home Assistant.
  auto_upgrade: true
  # Reboot the host automatically when an upgrade requires it.
  reboot_host: false
  # Restart guests automatically when an upgrade requires it.
  restart_guests: true
  # Remove unused packages, package caches and dangling container images.
  cleanup: true
  # Pull newer images and recreate compose projects; run podman auto-update.
  containers: true
  # Time limit for one step of an operation.
  command_timeout: 1h

nixos:
  # Rebuild from this flake instead of channels; "#<hostname>" is appended
  # unless a fragment is given. The agent runs: nixos-rebuild switch --refresh.
  flake: ""
  # Passed to nix-collect-garbage --delete-older-than during cleanup.
  gc_older_than: 14d

# What Home Assistant (and so anyone who can use it) may trigger.
permissions:
  # Upgrade packages, containers and single containers.
  upgrade: true
  # Reboot the machine the agent runs on.
  reboot_host: false
  # Restart Incus/Proxmox guests (containers and VMs).
  reboot_guests: false
  # Guests that are never restarted, not from Home Assistant and not
  # automatically after an upgrade (upgrade.restart_guests). Patterns: "name",
  # "project/name" (Incus), the VMID (Proxmox), shell-style wildcards, or
  # "type:vm" / "type:lxc" for all VMs or all containers.
  reboot_exclude: []
  # Restore a guest to its pre-upgrade snapshot.
  restore: false
  # Restart single docker/podman containers.
  restart_containers: false

# Shell commands whose output becomes a sensor, like LNXlink's bash module.
# They always run as the user nobody: no capabilities, no supplementary groups
# and no_new_privs (sudo and other setuid programs cannot gain privileges), so
# they can read what every user may read and change nothing. The target needs
# setpriv and setsid from util-linux (installed on nearly every distribution)
# or BusyBox (Alpine).
commands:
  # Time limit of one command. Output is limited to 64 KiB.
  timeout: 30s
  # A "Run command" text entity: whatever is typed runs as nobody and the
  # output shows in a "Command output" sensor.
  allow_any: false
  # Machines that get it: host, guests, or guest patterns like reboot_exclude.
  allow_any_machines: [host]
  expose: []
  #  - name: Failed units
  #    command: systemctl --failed --no-legend | wc -l
  #    type: sensor          # the first line of the output is the state
  #    unit: units
  #    icon: mdi:alert-circle
  #    interval: 5m
  #    machines: [host, guests]
  #  - name: Backup recent
  #    command: find /srv/backup/last -mmin -1500 | grep -q .
  #    type: binary_sensor   # on when the command exits with 0
  #    device_class: problem
  #    machines: [nas]

state_file: /var/lib/linux-ha-agent/state.json
log_level: info
