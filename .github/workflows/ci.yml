---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint (pre-commit, golangci-lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        env:
          # Lets zizmor run its online audits.
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with the race detector
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.runner }}
          path: coverage.out

  vulnerabilities:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build binaries and packages (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe needs the tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary, .deb and .rpm
        env:
          GOARCH: ${{ matrix.arch }}
        run: make packages GOARCH="$GOARCH"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ha-agent-${{ matrix.arch }}
          path: dist/

  synology:
    name: Synology package (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe needs the tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the .spk
        env:
          GOARCH: ${{ matrix.arch }}
        run: make spk GOARCH="$GOARCH"

      - name: Check the .spk
        run: |
          spk=$(ls dist/*.spk)
          mkdir check && tar -xf "$spk" -C check
          for f in INFO package.tgz scripts/start-stop-status scripts/postinst scripts/postupgrade \
            conf/privilege WIZARD_UIFILES/install_uifile WIZARD_UIFILES/upgrade_uifile.sh PACKAGE_ICON_256.PNG; do
            test -e "check/$f" || { echo "::error::$f missing in $spk"; exit 1; }
          done
          grep -Eq '^version="[0-9]+\.[0-9]+\.[0-9]+-[0-9]+"$' check/INFO
          grep -q '"run-as": "package"' check/conf/privilege
          python3 -m json.tool check/WIZARD_UIFILES/install_uifile >/dev/null
          SETTINGS=/nonexistent SYNOPKG_TEMP_LOGFILE='' sh check/WIZARD_UIFILES/upgrade_uifile.sh | python3 -m json.tool >/dev/null
          for f in check/scripts/*; do sh -n "$f"; done
          tar -tzf check/package.tgz | grep -qx './bin/linux-ha-agent'
          tar -tzf check/package.tgz | grep -qx './bin/root-task.sh'
          cat check/INFO

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ha-agent-dsm7-${{ matrix.arch }}
          path: dist/*.spk

  packages:
    name: Install package on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "ubuntu:24.04", format: deb}
          - {image: "debian:13", format: deb}
          - {image: "fedora:43", format: rpm}
          - {image: "rockylinux/rockylinux:10", format: rpm}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-ha-agent-amd64
          path: dist

      - name: Install, upgrade, remove
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: docker run --rm -v "$PWD:/src:ro" -e FORMAT "$IMAGE" sh /src/tests/packages/install-test.sh

  self-upgrade:
    # The agent upgrades its own package and restarts into the new version,
    # on the runner itself: it needs systemd. "release" is the published
    # agent, whose package manager the old postinstall script interrupted.
    name: Self-upgrade from ${{ matrix.from }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        from: [release, this commit]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q mosquitto mosquitto-clients dpkg-dev

      - name: Build the packages
        env:
          FROM: ${{ matrix.from }}
        run: |
          # Versions above any release, so apt takes the new one.
          make packages GOARCH=amd64 VERSION=v99.0.0
          if [ "$FROM" = "this commit" ]; then
            make packages GOARCH=amd64 VERSION=v98.0.0
          fi

      - name: Download the latest release
        if: matrix.from == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*_amd64.deb' --dir release

      - name: Upgrade itself
        env:
          FROM: ${{ matrix.from }}
        run: |
          if [ "$FROM" = release ]; then
            old=$(ls release/*_amd64.deb)
          else
            old=dist/linux-ha-agent_98.0.0-1_amd64.deb
          fi
          sudo OLD_DEB="$PWD/$old" NEW_DEB="$PWD/dist/linux-ha-agent_99.0.0-1_amd64.deb" \
            sh tests/packages/self-upgrade-test.sh

  repository:
    name: Package repository on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13", "fedora:43", "rockylinux/rockylinux:10"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe needs the tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apt-utils createrepo-c rpm

      - name: Create a test signing key
        run: |
          gpg --batch --quiet --passphrase '' --quick-gen-key "linux-ha-agent test <test@example.invalid>" rsa3072 sign never
          key=$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr/ {print $10; exit}')
          echo "REPO_SIGNING_KEY_ID=$key" >>"$GITHUB_ENV"
          (umask 077 && gpg --batch --armor --export-secret-keys "$key" >"$RUNNER_TEMP/signing-key.asc")

      - name: Build signed packages and the repository
        run: |
          NFPM_RPM_KEY_FILE="$RUNNER_TEMP/signing-key.asc" make packages GOARCH=amd64
          sh packaging/repo/build.sh dist site http://127.0.0.1:8000

      - name: Install with install.sh from the repository
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          (cd site && python3 -m http.server 8000 >/dev/null 2>&1 &)
          timeout 10 sh -c 'until curl -fs http://127.0.0.1:8000/deb/InRelease >/dev/null; do sleep 1; done'
          docker run --rm --network host -v "$PWD:/src:ro" -e LINUX_HA_AGENT_REPO_URL=http://127.0.0.1:8000 \
            "$IMAGE" sh /src/tests/packages/repo-test.sh

  go-install:
    name: go install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install the pushed commit like a user would
        env:
          # For pull requests GITHUB_SHA is a merge commit that only exists on GitHub.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # A pull request from a fork has its head commit only in the fork, and
          # with GOPROXY=direct Go only looks at this repository's branches and
          # tags. Empty for pushes and pull requests from branches here.
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.head.repo.clone_url || '' }}
          GOPROXY: direct
          # Newer git runs auto-maintenance detached after a fetch; it then
          # races with Go's next fetch in the same repository ("shallow file
          # has changed since we read it").
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: gc.auto
          GIT_CONFIG_VALUE_1: "0"
        run: |
          cd "$(mktemp -d)"
          if [ -n "$HEAD_REPO_URL" ]; then
            # Fetch the module from the fork under its real module path. The
            # checksum database fetches from this repository, so it does not
            # know the fork's commit either.
            export GIT_CONFIG_COUNT=3
            export GIT_CONFIG_KEY_2="url.${HEAD_REPO_URL}.insteadOf"
            export GIT_CONFIG_VALUE_2=https://github.com/lvlie/linux-ha-agent
            export GONOSUMDB=github.com/lvlie/linux-ha-agent
          fi
          go install "github.com/lvlie/linux-ha-agent/cmd/linux-ha-agent@${COMMIT}"
          "$(go env GOPATH)/bin/linux-ha-agent" -version | tee /dev/stderr | grep -q "${COMMIT:0:12}"

  nix:
    name: Nix flake (package and NixOS module)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file
