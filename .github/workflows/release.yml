---
name: Release

on:
  push:
    tags: ["v*"]
  # Release from the Actions tab (or the API) without pushing a tag first:
  # the release, and with it the tag, is created on the selected branch.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache in release builds

      - name: Determine the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          if ! echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v1.2.3, got '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          make packages GOARCH=amd64 VERSION="$VERSION"
          make packages GOARCH=arm64 VERSION="$VERSION"
          cp config.example.yaml packaging/systemd/linux-ha-agent.service packaging/install.sh dist/
          cd dist && sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/linux-ha-agent-linux-*
            dist/*.deb
            dist/*.rpm

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag already exists; a manual release creates it on this commit.
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "$VERSION" \
            --generate-notes --target "$GITHUB_SHA"
