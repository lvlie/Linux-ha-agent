---
name: Package repository

# Publishes the signed apt and dnf repository on GitHub Pages, built from the
# packages of the last releases. Runs after every release; run it from the
# Actions tab to rebuild the repository without a release.
on:
  workflow_call:
    secrets:
      REPO_SIGNING_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apt-utils createrepo-c rpm

      - name: Import the signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          if [ -z "$REPO_SIGNING_KEY" ]; then
            echo "::error::the REPO_SIGNING_KEY secret is not set"
            exit 1
          fi
          printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --quiet --import
          # Clients get the published key, so the secret must be that key.
          key=$(gpg --batch --with-colons --import-options show-only --import packaging/repo/linux-ha-agent.asc |
            awk -F: '/^fpr/ {print $10; exit}')
          if ! gpg --batch --list-secret-keys "$key" >/dev/null 2>&1; then
            echo "::error::REPO_SIGNING_KEY is not the key in packaging/repo/linux-ha-agent.asc ($key)"
            exit 1
          fi
          echo "REPO_SIGNING_KEY_ID=$key" >>"$GITHUB_ENV"

      - name: Download the packages of the last releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir packages
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 5 \
            --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir packages --pattern '*.deb' --pattern '*.rpm'
            done
          ls -l packages

      - name: Build
        run: sh packaging/repo/build.sh packages site "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
